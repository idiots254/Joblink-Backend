<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="src/Login/Login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="path/to/logo.png" alt="Logo" class="login-logo-image">
                <h1 class="login-logo">Your Logo</h1>
                <h2 class="login-title">Welcome Back</h2>
                <p class="login-brand-text">Please sign in to continue</p>
            </div>
            <form class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn-primary">Sign In</button>
                </div>
                <div class="login-divider">
                    <span>or</span>
                </div>
                <div class="form-group">
                    <button type="button" class="btn-google">Sign in with Google</button>
                </div>
                <div class="login-footer">
                    <p class="terms-text">By signing in, you agree to our <a href="#" class="footer-link">Terms of Service</a> and <a href="#" class="footer-link">Privacy Policy</a>.</p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
